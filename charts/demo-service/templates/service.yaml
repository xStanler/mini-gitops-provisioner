apiVersion: v1
kind: Service
metadata:
  name: "{{ .Chart.Name }}-service"
  labels: 
    chart: '{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}'
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  selector:
    app: "{{ .Chart.Name }}"
